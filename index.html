  $('#counter').textContent = (idx+1)+' / '+visible.length;
  const fbox = $('#filters'); fbox.innerHTML='';
  for (const f of ['all','out','in','bed']) {
    const b=document.createElement('button');
    b.className='filter-btn'+(f===filter?' on':''); b.textContent=t.filters[f];
    b.addEventListener('click', () => { filter=f; photo=0; renderGallery(); });
    fbox.appendChild(b);
  }
  const tbox = $('#thumbs'); tbox.innerHTML='';
  visible.forEach((p,i) => {
    const b=document.createElement('button');
    b.className='thumb'+(i===idx?' on':''); b.setAttribute('aria-label', t.caps[p.cap]);
    const im=document.createElement('img'); im.src='photos/'+p.id+'-t.webp'; im.alt=t.caps[p.cap]; im.loading='lazy';
    b.appendChild(im);
    b.addEventListener('click', () => { photo=i; renderGallery(); });
    tbox.appendChild(b);
  });
  $('#prev').onclick = () => { photo = (idx-1+visible.length)%visible.length; renderGallery(); };
  $('#next').onclick = () => { photo = (idx+1)%visible.length; renderGallery(); };
}

renderText(); renderGallery();
</script>
</body>
</html>
